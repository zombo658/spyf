name: Build APK

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeoWalker-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoWalker-debug-apk
          path: out/GeoWalker-debug.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: GeoWalker (последний debug-APK)
          body: |
            Свежая debug-сборка GeoWalker. Скачай GeoWalker-debug.apk на телефон и установи
            (разреши установку из этого источника). Обновляется автоматически при каждом пуше.
          files: out/GeoWalker-debug.apk
